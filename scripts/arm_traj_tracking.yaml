# 手臂轨迹跟踪测试，只给 arm_traj_tracking_test 读取。
# 开源仓库不包含控制器源码，本文件不会热加载 kp/kd。
#
# 左臂 zarm_l1..l4 相对当前位姿的步进，单位 deg，四个关节各自填写，可正可负。
# 右臂按镜像生成：pitch/elbow 用相同角度，roll/yaw 取相反数。单个绝对值不超过 50。
left_delta_deg: [-40, 40, -40, -40]

# 从当前位姿插到目标的时间，秒。
move_sec: 1.5
# 到达目标后的保持时间，毫秒。误差统计取这段里跳过 skip_ms 之后的样本。
hold_ms: 2000
# 保持段开头不计入误差的时间，毫秒。
skip_ms: 500
# 移动前先保持当前位姿的时间，毫秒，用来打开指令直通。
settle_ms: 300
# 发布 /rt/arm_trajectory 的频率，Hz。
rate_hz: 200
