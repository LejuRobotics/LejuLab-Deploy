#########################################################
# Roban v14 全 SocketCAN 配置 (RK3588 原生 CAN FD 接口)
#
# bcan0: 左腿+腰 — CAN FD 广播协议
# bcan1: 右腿 — CAN FD 广播协议
# bcan2: 左臂+头 — CAN 单帧协议
# bcan3: 右臂 — CAN 单帧协议 (接口异常，已屏蔽)
#########################################################
canbus_interfaces:
  # ===== 腿部 CAN FD 广播总线 =====
  bcan0:
    type: SOCKETCAN
    name: "bcan0"
    nbitrate: 1000000
    dbitrate: 5000000
    nsamplepos: 80
    dsamplepos: 75
    enable: true
    protocol: canfd_broadcast
  bcan1:
    type: SOCKETCAN
    name: "bcan1"
    nbitrate: 1000000
    dbitrate: 5000000
    nsamplepos: 80
    dsamplepos: 75
    enable: true
    protocol: canfd_broadcast
  # ===== 手臂/头 经典 CAN 单帧总线 =====
  bcan2:
    type: SOCKETCAN
    name: "bcan2"
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: true
  bcan3:
    type: SOCKETCAN
    name: "bcan3"
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: false                          # 接口异常，暂时屏蔽
#########################################################
# bcan0: 左腿 (joint 1-6) + 腰 (joint 13) — CAN FD 广播
# 电机默认参数: [vel, kp_pos, kd_pos, tor, kp_vel, kd_vel, ki_vel]
#########################################################
bcan0_devices:
  # ///////////////
  - name: Lleg_joint_01
    class: motor
    device_id: 0x01
    params: [0, 200, 50, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  # ///////////////
  - name: Lleg_joint_02
    class: motor
    device_id: 0x02
    params: [0, 200, 50, 0, 0, 0, 0]
    ratio: 36
    negtive: false
    ignore: false
