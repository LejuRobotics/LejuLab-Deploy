    ratio: 36
    negtive: false
    ignore: false
  # ///////////////
  - name: Lleg_joint_05
    class: motor
    device_id: 0x05
    params: [0, 100, 30, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  # ///////////////
