#########################################################
# Kuavo 4 PRO RK3588 SocketCAN 配置
# 使用 RK3588 原生 CAN FD 接口 (非 USB-CAN 适配器)
#
# 前置条件:
#   sudo ip link set can0 up type can bitrate 1000000 dbitrate 2000000 fd on
#########################################################
canbus_interfaces:
  canbus0:
    type: SOCKETCAN
    name: "can0"            # Linux SocketCAN 接口名称
    nbitrate: 1000          # 仲裁段波特率 (kbps)
    dbitrate: 2000          # 数据段波特率 (kbps)
    nsamplepos: 75          # 仲裁段采样点 (%)
    dsamplepos: 75          # 数据段采样点 (%)
    enable: true
#########################################################
# canbus0 上的设备列表
# 设备类型: motor, revo2_hand, lejuclaw
# 电机默认参数: [vel, kp_pos, kd_pos, tor, kp_vel, kd_vel, ki_vel]
#
# 注意: 如果是想禁用或者忽略设备请使用`ignore`字段, 不需要把设备Id改成0x00！
# 注意 ignore 字段只是不使能设备，对应的数据还是会暂位的（即返回默认数据0），如果想要移除设备，请删除或者注释它
#########################################################
canbus0_devices:
  # ///////////////
  - name: Larm_joint_02             # 设备名称
    class: motor                    # 设备类型
    device_id: 0x01                 # 设备ID
    # [vel, kp_pos, kd_pos, tor, kp_vel, kd_vel, ki_vel]
    params: [0, 35, 2, 0, 0, 0, 0]  # 电机默认的参数
    ratio: 36                       # 减速比
    negtive: false                  # 电机方向
    ignore: false                   # 是否忽略/禁用
  # ///////////////
  - name: Larm_joint_03
    class: motor
    device_id: 0x02
    params: [0, 35, 2, 0, 0, 0, 0]
    ratio: 36
    negtive: true
    ignore: false
  # ///////////////
  - name: Larm_joint_04
    class: motor
    device_id: 0x03
    params: [0, 35, 2, 0, 0, 0, 0]
    ratio: 36
    negtive: false
    ignore: false
  # ///////////////
  - name: Larm_joint_05
    class: motor
    device_id: 0x04
    params: [0, 35, 2, 0, 0, 0, 0]
    ratio: 25
    negtive: true
    ignore: false
  # ///////////////
  - name: Larm_joint_06
    class: motor
