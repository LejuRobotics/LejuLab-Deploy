#########################################################
# Roban v17 全 SocketCAN 配置 (RK3588)
#
# bcan0: CAN FD 广播 — 腰(1) + 左腿(6) = 7 电机
# bcan1: CAN FD 广播 — 右腿(6) = 6 电机
# bcan2: 经典 CAN 单帧 — 左臂(4) + 头(2) = 6 电机
# bcan3: 经典 CAN 单帧 — 右臂(4) = 4 电机
# 注: bcan2/bcan3 物理线已交换用于调试
#########################################################
canbus_interfaces:
  # ===== 腿部 CAN FD 广播总线 =====
  bcan0:
    type: SOCKETCAN
    name: bcan0
    nbitrate: 1000000
    dbitrate: 5000000
    nsamplepos: 80
    dsamplepos: 75
    enable: true
    protocol: canfd_broadcast
  bcan1:
    type: SOCKETCAN
    name: bcan1
    nbitrate: 1000000
    dbitrate: 5000000
    nsamplepos: 80
    dsamplepos: 75
    enable: true
    protocol: canfd_broadcast
  # ===== 手臂/头 经典 CAN 单帧总线 =====
  bcan2:
    type: SOCKETCAN
    name: bcan2
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: true
  bcan3:
    type: SOCKETCAN
    name: bcan3
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: true
#########################################################
# bcan0: 腰 (1) + 左腿 (6) — CAN FD 广播
# 物理拓扑: Waist=0x01, Lleg_01-06=0x02-0x07
#########################################################
bcan0_devices:
  - name: Waist_joint_01
    class: motor
    device_id: 0x01
    params: [0, 40.179, 2.557, 0, 0, 0, 0]
    ratio: 25
    negtive: true
    ignore: false
  - name: Lleg_joint_01
    class: motor
    device_id: 0x02
    params: [0, 90.179, 3.557, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Lleg_joint_02
    class: motor
    device_id: 0x03
    params: [0, 150.098, 8.308, 0, 0, 0, 0]
    ratio: 36
    negtive: true
    ignore: false
  - name: Lleg_joint_03
    class: motor
    device_id: 0x04
    params: [0, 40.179, 3.557, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Lleg_joint_04
    class: motor
    device_id: 0x05
    params: [0, 150.098, 8.038, 0, 0, 0, 0]
    ratio: 36
    negtive: false
    ignore: false
  - name: Lleg_joint_05
    class: motor
    device_id: 0x06
    params: [0, 34.25, 1.907, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Lleg_joint_06
    class: motor
    device_id: 0x07
    params: [0, 34.25, 1.907, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
