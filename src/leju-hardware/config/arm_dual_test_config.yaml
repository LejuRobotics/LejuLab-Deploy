#########################################################
# bcan2 + bcan3 双臂测试配置
# bcan2: 4个电机 (ID 0x05-0x08) 左臂
# bcan3: 6个电机 (ID 0x01-0x04, 0x09-0x0A) 右臂
# 经典 CAN 单帧协议
#########################################################
canbus_interfaces:
  bcan2:
    type: SOCKETCAN
    name: "bcan2"
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: true
  bcan3:
    type: SOCKETCAN
    name: "bcan3"
    nbitrate: 1000000
    dbitrate: 1000000
    nsamplepos: 80
    dsamplepos: 80
    enable: true
#########################################################
# bcan2: 左臂 4个电机 (ID 0x05-0x08)
#########################################################
bcan2_devices:
  - name: arm_joint_01
    class: motor
    device_id: 0x05
    params: [0, 25, 8, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: arm_joint_02
    class: motor
    device_id: 0x06
    params: [0, 20, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: arm_joint_03
    class: motor
    device_id: 0x07
    params: [0, 20, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: arm_joint_04
    class: motor
    device_id: 0x08
    params: [0, 25, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
#########################################################
# bcan3: 右臂 6个电机 (ID 0x01-0x04, 0x09-0x0A)
#########################################################
bcan3_devices:
  - name: Rarm_joint_01
    class: motor
    device_id: 0x01
    params: [0, 25, 8, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Rarm_joint_02
    class: motor
    device_id: 0x02
    params: [0, 20, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Rarm_joint_03
    class: motor
    device_id: 0x03
    params: [0, 20, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Rarm_joint_04
    class: motor
    device_id: 0x04
    params: [0, 25, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Rarm_joint_05
    class: motor
    device_id: 0x09
    params: [0, 25, 8, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
  - name: Rarm_joint_06
    class: motor
    device_id: 0x0A
    params: [0, 20, 6, 0, 0, 0, 0]
    ratio: 25
    negtive: false
    ignore: false
