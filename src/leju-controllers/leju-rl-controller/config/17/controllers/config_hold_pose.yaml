# 搬运模式 LOCK 用 HoldPoseController 配置
# 激活后捕获当前全身关节位，之后位控锁死（刚性"雕像"，可被安全搬运）。
# 增益完全沿用 amp 运控（config_amp.yaml actuator_kp/kd）。
# 列表外关节（头部 zhead_*）使用控制器内置 fallback kp=50/kd=2。
loop_dt: 0.001

robot:
  joint_names:
    ["waist_yaw_joint",
     "leg_l1_joint", "leg_l2_joint", "leg_l3_joint", "leg_l4_joint", "leg_l5_joint", "leg_l6_joint",
     "leg_r1_joint", "leg_r2_joint", "leg_r3_joint", "leg_r4_joint", "leg_r5_joint", "leg_r6_joint",
     "zarm_l1_joint", "zarm_l2_joint", "zarm_l3_joint", "zarm_l4_joint",
     "zarm_r1_joint", "zarm_r2_joint", "zarm_r3_joint", "zarm_r4_joint"]
  # 同 config_amp.yaml
  actuator_kp:
    [40.179,
     90.179, 150.098, 40.179, 150.098, 34.25, 34.25,
     90.179, 150.098, 40.179, 150.098, 34.25, 34.25,
     14.25, 14.25, 14.25, 14.25,
     14.25, 14.25, 14.25, 14.25]
  actuator_kd:
    [2.557,
     3.557, 8.308, 3.557, 8.308, 1.907, 1.907,
     3.557, 8.308, 3.557, 8.308, 1.907, 1.907,
     0.907, 0.907, 0.907, 0.907,
     0.907, 0.907, 0.907, 0.907]
